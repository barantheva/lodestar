<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="#0d1117"/>
  <g transform="translate(256, 256)">
    <!-- Technical Accent Lines & Radar Grid -->
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="6 6"/>
    <circle r="100" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle r="60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
    
    <!-- Coordinate Axis Marks -->
    <line x1="-190" y1="0" x2="-160" y2="0" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="160" y1="0" x2="190" y2="0" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="0" y1="-190" x2="0" y2="-160" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="0" y1="160" x2="0" y2="190" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5"/>

    <!-- Main Star Body with Precision Facets -->
    <!-- North Point (Electric Cyan/Blue) -->
    <path d="M 0,-180 L 32,0 L 0,0 Z" fill="#38bdf8" fill-opacity="0.95"/>
    <path d="M 0,-180 L -32,0 L 0,0 Z" fill="#0284c7" fill-opacity="0.75"/>
    
    <!-- South Point (Indigo/Violet) -->
    <path d="M 0,180 L 32,0 L 0,0 Z" fill="#818cf8" fill-opacity="0.95"/>
    <path d="M 0,180 L -32,0 L 0,0 Z" fill="#4f46e5" fill-opacity="0.75"/>
    
    <!-- East Point (Electric Cyan/Blue) -->
    <path d="M 180,0 L 0,32 L 0,0 Z" fill="#38bdf8" fill-opacity="0.85"/>
    <path d="M 180,0 L 0,-32 L 0,0 Z" fill="#0284c7" fill-opacity="0.6"/>
    
    <!-- West Point (Indigo/Violet) -->
    <path d="M -180,0 L 0,32 L 0,0 Z" fill="#818cf8" fill-opacity="0.85"/>
    <path d="M -180,0 L 0,-32 L 0,0 Z" fill="#4f46e5" fill-opacity="0.6"/>

    <!-- Diagonal Secondary Glint Points -->
    <polygon points="0,0 35,-35 0,-15 -15,0" fill="#38bdf8" fill-opacity="0.4"/>
    <polygon points="0,0 -35,-35 0,-15 15,0" fill="#38bdf8" fill-opacity="0.3"/>
    <polygon points="0,0 35,35 0,15 -15,0" fill="#818cf8" fill-opacity="0.4"/>
    <polygon points="0,0 -35,35 0,15 15,0" fill="#818cf8" fill-opacity="0.3"/>

    <!-- Center Lodestar Core Beacon Glow -->
    <circle r="14" fill="#38bdf8" fill-opacity="0.3"/>
    <circle r="7" fill="#ffffff"/>
  </g>
</svg>
